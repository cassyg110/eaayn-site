<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>East Africa Agritech Youth Network (EAAYAN)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--g:#1b6b3a;--g2:#e6f2ea;--o:#f29a1f;--bg:#fbfaf6;--card:#fff;--tx:#17231c;--mu:#5a6a60;--bd:#dde5df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4ec27d;--g2:#173324;--bg:#0f1712;--card:#16211a;--tx:#eaf2ec;--mu:#9bb0a2;--bd:#27382d}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;line-height:1.2;margin:0 0 .5em}
h1{font-size:clamp(2rem,6vw,3.2rem)}h2{font-size:clamp(1.5rem,4vw,2.1rem)}h3{font-size:1.1rem}
a{color:var(--g)}.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;max-width:1080px;margin:0 auto}
.logo{font:700 1.25rem Poppins,sans-serif;color:var(--g);text-decoration:none}.logo span{color:var(--o)}
.logo small{display:block;font:500 .62rem Inter,sans-serif;color:var(--mu)}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--tx);font-size:.92rem}
nav a.on,nav a:hover{background:var(--g2);color:var(--g)}nav a.join{background:var(--o);color:#1a1200;font-weight:500}
#mb{display:none;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:1rem}
@media(max-width:820px){#mb{display:block}nav{display:none;width:100%;flex-direction:column;align-items:stretch}nav.open{display:flex}.nav{flex-wrap:wrap}}
.hero{background:linear-gradient(135deg,#0f4d29,#1b6b3a 60%,#2d8a50);color:#fff;padding:72px 0 64px;position:relative;overflow:hidden}
.hero p{max-width:620px;font-size:1.1rem}.hero .w{position:relative}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:340px;height:340px;border-radius:50%;background:var(--o);opacity:.18}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;border:2px solid var(--o);background:var(--o);color:#1a1200;cursor:pointer;font:500 1rem Inter,sans-serif;margin:6px 8px 0 0}
.btn.o{background:transparent;color:#fff;border-color:#fff}
.sec{padding:56px 0}.alt{background:var(--g2)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}
.card p{margin:0;color:var(--mu);font-size:.95rem}.ic{font-size:1.6rem;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;text-align:center}
.stats b{display:block;font:700 2rem Poppins,sans-serif;color:var(--g)}.stats span{color:var(--mu);font-size:.9rem}
.ph{padding:44px 0 28px;background:var(--g2)}.ph p{color:var(--mu);max-width:640px;margin:0}
form{display:grid;gap:14px;max-width:560px}label{font-weight:500;font-size:.92rem;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
.ok{display:none;padding:14px;border-radius:10px;background:var(--g2);color:var(--g);max-width:560px;margin-top:14px}
.cta{background:var(--g);color:#fff;text-align:center;padding:48px 20px}.cta h2{color:#fff}
footer{background:#0d1a12;color:#c9d8ce;padding:36px 0;font-size:.9rem}footer a{color:#f5c26b}
.fg{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
ul.l{padding-left:18px;margin:0}ul.l li{margin:6px 0}
#eb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;margin:0}
#ep{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 80px}
#ep fieldset{border:1px solid var(--bd);border-radius:10px;margin:10px 0;padding:10px}#ep legend{font-weight:700;color:var(--g)}
#ep .row{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin:8px 0}#ep button{cursor:pointer;margin:4px 4px 0 0;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
#ep .bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}#ep form{max-width:none}
#ep{display:block}</style></head><body><div class="w" style="padding-top:24px"><h1>EAAYAN admin</h1><form id="lf"><label>Email<input id="em" type="email" required></label><label>Password<input id="pw" type="password" required></label><button class="btn" style="margin:0" type="submit">Log in</button></form><p id="msg"></p></div><div id="ep" style="display:none"></div>
<script src="config.js"></script><script>
var CF=window.EAAYAN_CONFIG||{},D=null,TOK=null;
function $(i){return document.getElementById(i)}
function E(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function SB(t){return{apikey:CF.supabaseKey,Authorization:"Bearer "+t,"Content-Type":"application/json"}}
function ref(p){var a=p.split(".").slice(1),o=D;for(var i=0;i<a.length-1;i++)o=o[a[i]];return[o,a[a.length-1]]}
function ed(o,p){if(Array.isArray(o))return o.map(function(x,i){return '<div class="row">'+ed(x,p+"."+i)+'<button type="button" data-del="'+p+"."+i+'">Remove</button></div>'}).join("")+'<button type="button" data-add="'+p+'">+ Add item</button>';
return Object.keys(o).map(function(k){var v=o[k];return v&&typeof v=="object"?'<fieldset><legend>'+E(k)+'</legend>'+ed(v,p+"."+k)+'</fieldset>':'<label>'+E(k)+'<textarea rows="'+(String(v).length>80?3:1)+'" data-p="'+p+"."+k+'">'+E(v)+'</textarea></label>'}).join("")}

function show(){$("ep").style.display="block";$("ep").innerHTML='<div class="bar"><b>Edit site content</b> <button id="sv">Save</button> <button id="lo">Log out</button> <span id="st"></span></div>'+ed(D,"D")}
$("lf").onsubmit=async function(e){e.preventDefault();var r=await fetch(CF.supabaseUrl+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:CF.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value,password:$("pw").value})});var j=await r.json();
if(!j.access_token){$("msg").textContent="Login failed";return}TOK=j.access_token;$("lf").style.display="none";
var a=await(await fetch(CF.supabaseUrl+"/rest/v1/content?id=eq.1&select=data",{headers:SB(TOK)})).json();D=a[0]?a[0].data:await(await fetch("content.json")).json();show()};
$("ep").oninput=function(e){var p=e.target.dataset.p;if(p){var r=ref(p);r[0][r[1]]=e.target.value}};
$("ep").onclick=async function(e){var t=e.target,r;
if(t.dataset.del){r=ref(t.dataset.del);r[0].splice(+r[1],1);show()}
else if(t.dataset.add){r=ref(t.dataset.add+".x");var n=JSON.parse(JSON.stringify(r[0][0]||{}));Object.keys(n).forEach(function(k){n[k]=""});r[0].push(n);show()}
else if(t.id=="lo")location.reload();
else if(t.id=="sv"){$("st").textContent="Saving…";var h=SB(TOK);h.Prefer="resolution=merge-duplicates";var q=await fetch(CF.supabaseUrl+"/rest/v1/content",{method:"POST",headers:h,body:JSON.stringify({id:1,data:D})});$("st").textContent=q.ok?"Saved. The live site is updated.":"Save failed ("+q.status+")"}};
</script></body></html>
